<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>SS-ADMIN-008 before (defect mock)</title>
<style>
  body{margin:0;font:14px/1.4 system-ui;background:#e8e8ec;color:#111}
  .sheet{width:420px;height:640px;margin:24px auto;background:#fff;border:1px solid #ccc;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.12)}
  .head{padding:16px 20px;border-bottom:1px solid #ddd;font-weight:600}
  .body{position:relative;height:560px;padding:16px;overflow:hidden}
  .box{border:1px solid #ddd;border-radius:8px;padding:12px;background:#f7f7f9;margin-bottom:12px}
  .notes{position:relative;z-index:1;min-height:0;height:72px}
  textarea{width:100%;height:180px;border:1px solid #ccc;border-radius:8px;padding:8px;resize:none;box-sizing:border-box}
  .comms{position:relative;margin-top:-110px;z-index:2;opacity:.95}
  .btn{display:inline-block;background:#1d4ed8;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:8px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#666;margin-bottom:4px}
  .caption{text-align:center;color:#666;margin-top:8px;font-size:12px}
</style></head><body>
<div class="sheet"><div class="head">Project detail (before — overlap defect)</div>
<div class="body">
  <div class="box">Source recommendation / status</div>
  <div class="notes">
    <div class="label">Notes</div>
    <textarea>Long staff notes about scheduling, vendor coordination, firewall change window, and follow-up with the client. Additional lines keep growing and spill into the next section visually when the flex parent collapses.</textarea>
  </div>
  <div class="box comms">
    <div class="label">Customer communications</div>
    <div>Prepare a consolidated update from real project activity.</div>
    <div class="btn">Prepare Customer Update</div>
  </div>
  <div class="box">Delivery progress</div>
</div></div>
<p class="caption">Illustrative mock of the reported overlap (not production data).</p>
</body></html>
